name: Feature request
description: Suggest an idea or a new destination
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: input
    id: printer
    attributes:
      label: Printer model (if relevant)
