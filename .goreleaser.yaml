version: 2

project_name: brother-scan-server

builds:
  - id: brother-scan-server
    main: ./cmd/brother-scan-server
    binary: brother-scan-server
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ignore:
      - { goos: darwin, goarch: arm }
      - { goos: windows, goarch: arm }
      - { goos: freebsd, goarch: arm }

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    files:
      - README.md
      - LICENSE
      - config.yaml.example

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore\(deps\):'
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
  footer: |
    **Docker images**

    ```
    docker pull aurimasniekis/go-brother-scan-to-network-server:{{ .Version }}
    docker pull ghcr.io/aurimasniekis/go-brother-scan-to-network-server:{{ .Version }}
    ```
